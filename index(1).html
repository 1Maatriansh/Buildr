<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buildr — Stop scrolling. Start building.</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&display=swap');

  :root{
    --bg:#F0F0F0;
    --fg:#121212;
    --red:#D02020;
    --blue:#1040C0;
    --yellow:#F0C020;
    --muted:#E0E0E0;
    --white:#FFFFFF;
    --header-h:76px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(#00000014 1.6px, transparent 1.6px) 0 0/22px 22px,
      var(--bg);
    color:var(--fg);
    font-family:'Outfit', sans-serif;
    font-weight:500;
    overflow-x:hidden;
    padding-top:var(--header-h);
  }
  h1,h2,h3{margin:0; letter-spacing:-0.02em;}
  button{font-family:inherit;}
  a{color:inherit;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }

  .deco{position:absolute; pointer-events:none; z-index:0;}
  .deco.circle{border-radius:9999px;}
  .deco.square{border-radius:0;}
  .deco.tri{width:0;height:0; background:transparent !important;}

  /* ---------- top bar ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0;
    height:var(--header-h);
    background:var(--white);
    border-bottom:4px solid var(--fg);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 24px;
    z-index:100;
  }
  .logo{display:flex; align-items:center; gap:10px; cursor:pointer; background:none; border:none; padding:0;}
  .logo-mark{display:flex; align-items:center; gap:3px;}
  .logo-mark .c1{width:18px;height:18px;background:var(--red); border-radius:9999px;}
  .logo-mark .c2{width:18px;height:18px;background:var(--blue); border-radius:0; transform:rotate(45deg);}
  .logo-mark .c3{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid var(--yellow);}
  .logo-word{font-weight:900; font-size:1.3rem; text-transform:uppercase; letter-spacing:-0.03em;}
  .topbar-actions{display:flex; gap:10px;}

  /* ---------- buttons ---------- */
  .btn{
    border:2px solid var(--fg); border-radius:0;
    padding:15px 28px; font-size:14px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.04em; cursor:pointer;
    box-shadow:4px 4px 0px 0px var(--fg);
    transition:transform .2s ease-out, box-shadow .2s ease-out, background .2s ease-out;
  }
  .btn:active{transform:translate(2px,2px); box-shadow:0px 0px 0px 0px var(--fg);}
  .btn-red{background:var(--red); color:var(--white);}
  .btn-blue{background:var(--blue); color:var(--white);}
  .btn-yellow{background:var(--yellow); color:var(--fg);}
  .btn-outline{background:var(--white); color:var(--fg);}
  .btn-ghost{
    background:none; border:none; box-shadow:none; color:var(--fg);
    text-transform:uppercase; font-weight:700; font-size:13px; letter-spacing:0.04em;
    padding:8px 0; display:inline-flex; align-items:center; gap:6px;
  }
  .btn-ghost:hover{transform:translateX(-3px);}
  .btn.small{padding:10px 18px; font-size:12px; box-shadow:3px 3px 0px 0px var(--fg);}

  .icon-btn{
    width:44px;height:44px; border-radius:9999px; border:2px solid var(--fg);
    background:var(--white); display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .2s ease-out, background .2s ease-out;
    flex-shrink:0; position:relative; z-index:1;
  }
  .icon-btn:hover{transform:translateY(-2px) rotate(-6deg);}
  .icon-btn.saved{background:var(--yellow);}

  /* ---------- views ---------- */
  main{position:relative;}
  .view{
    position:absolute; inset:0;
    min-height:calc(100vh - var(--header-h));
    padding:0 6vw 10vh;
    opacity:0; visibility:hidden; transform:translateY(8px);
    transition:opacity .25s ease-out, transform .25s ease-out;
    pointer-events:none;
    overflow:hidden;
  }
  .view.active{opacity:1; visibility:visible; transform:translateY(0); position:relative; pointer-events:auto;}

  /* ---------- hero ---------- */
  #view-hero{padding:0;}
  .hero-grid{display:grid; grid-template-columns:1.15fr 0.85fr; min-height:calc(100vh - var(--header-h)); position:relative;}
  .hero-left{display:flex; flex-direction:column; justify-content:center; padding:6vw; position:relative; z-index:2;}
  .hero-title{font-size:clamp(2.6rem, 6.4vw, 6.2rem); font-weight:900; text-transform:uppercase; line-height:0.9;}
  .hero-title .tilt{display:inline-block; transform:rotate(-2.5deg); color:var(--red);}
  .hero-sub{font-size:1.05rem; font-weight:500; max-width:440px; margin:26px 0 34px; line-height:1.6;}
  .hero-actions{display:flex; gap:14px; flex-wrap:wrap;}
  .hero-right{background:var(--blue); position:relative; overflow:hidden; min-height:280px;
    background-image:radial-gradient(rgba(255,255,255,0.18) 2px, transparent 2px);
    background-size:26px 26px;
  }
  .hero-right .s1{position:absolute; width:240px; height:240px; background:var(--yellow); border-radius:9999px; top:-70px; left:-70px;}
  .hero-right .s2{position:absolute; width:190px; height:190px; background:var(--red); border-radius:0; transform:rotate(30deg); bottom:6%; right:-50px;}
  .hero-right .s3{position:absolute; width:0;height:0; border-left:64px solid transparent; border-right:64px solid transparent; border-bottom:110px solid var(--white); left:52%; top:56%; transform:translate(-50%,-50%) rotate(-8deg);}
  .hero-right .s4{position:absolute; width:78px; height:78px; border:5px solid var(--fg); border-radius:9999px; top:36%; left:16%;}
  .hero-right .s5{position:absolute; width:46px; height:46px; background:var(--fg); top:14%; right:22%; transform:rotate(20deg);}
  .hero-overlap-1{position:absolute; z-index:3; width:130px; height:130px; border-radius:9999px; background:var(--yellow); top:8%; left:calc(1.15fr - 60px); opacity:0.9;
    left:auto; right:calc(85% - 65px);
  }
  .hero-overlap-2{position:absolute; z-index:1; width:200px; height:200px; background:var(--red); opacity:0.10; transform:rotate(15deg); bottom:-60px; left:2%;}
  .hero-overlap-3{position:absolute; z-index:1; width:140px; height:140px; border-radius:9999px; background:var(--blue); opacity:0.10; top:-40px; left:38%;}

  @media (max-width:860px){
    .hero-grid{grid-template-columns:1fr;}
    .hero-left{padding:12vw 6vw 8vw;}
    .hero-right{min-height:220px;}
    .hero-overlap-1{display:none;}
  }

  /* ---------- section headers ---------- */
  .section-header{padding-top:6vh; max-width:640px; position:relative; z-index:2;}
  .section-header h2{font-size:clamp(2rem,4.4vw,3.2rem); font-weight:900; text-transform:uppercase;}
  .section-header h2 .tilt{display:inline-block; transform:rotate(-2deg);}
  .section-header p{margin-top:10px; font-size:1rem; line-height:1.6; font-weight:600;}
  .back-row{padding-top:24px; position:relative; z-index:2;}

  /* ---------- categories view ---------- */
  #view-categories{background:var(--yellow);}
  #view-categories .deco.d1{width:340px; height:340px; top:-120px; right:-100px; background:var(--fg); opacity:0.06;}
  #view-categories .deco.d2{width:220px; height:220px; bottom:4%; left:-80px; background:var(--red); opacity:0.14; transform:rotate(20deg);}
  #view-categories .deco.d3{width:0;height:0; border-left:70px solid transparent; border-right:70px solid transparent; border-bottom:120px solid var(--blue); opacity:0.12; top:20%; right:8%; transform:rotate(10deg);}

  .category-grid{display:grid; grid-template-columns:repeat(6, 1fr); gap:22px; margin-top:36px; position:relative; z-index:2;}
  .cat-card{
    grid-column:span 3; background:var(--white); border:4px solid var(--fg);
    box-shadow:8px 8px 0px 0px var(--fg); padding:28px; min-height:186px;
    display:flex; flex-direction:column; justify-content:space-between;
    cursor:pointer; position:relative; transition:transform .2s ease-out;
  }
  .cat-card:nth-child(3n+2){transform:rotate(-0.6deg);}
  .cat-card:nth-child(3n+3){transform:rotate(0.6deg);}
  .cat-card:hover{transform:translateY(-6px) rotate(0deg) !important;}
  .cat-card.big{grid-column:span 4; min-height:236px;}
  .cat-card.small{grid-column:span 2;}
  .cat-card.filled{color:var(--white);}
  .cat-card.filled .count{color:rgba(255,255,255,0.88);}
  .cat-card .corner{position:absolute; top:14px; right:14px; width:18px; height:18px;}
  .icon-box{width:54px; height:54px; border:3px solid var(--fg); display:flex; align-items:center; justify-content:center; background:var(--white);}
  .cat-card.filled .icon-box{background:var(--fg); border-color:var(--white);}
  .cat-card .icon-box svg{width:26px; height:26px;}
  .cat-card h3{font-size:1.35rem; font-weight:900; text-transform:uppercase; margin-top:18px;}
  .cat-card .count{font-size:13px; margin-top:6px; font-weight:500;}

  @media (max-width:780px){
    .category-grid{grid-template-columns:repeat(2,1fr);}
    .cat-card, .cat-card.big, .cat-card.small{grid-column:span 1; transform:none !important;}
  }

  /* ---------- ideas view ---------- */
  #view-ideas{background:var(--section-bg, var(--bg)); transition:background .2s ease-out;}
  #view-ideas .section-header h2, #view-ideas .section-header p, #view-ideas .btn-ghost{color:var(--on-color, var(--fg));}
  #view-ideas .deco{background:var(--on-color, var(--fg)); opacity:0.10;}
  #view-ideas .deco.i1{width:300px; height:300px; border-radius:9999px; top:-100px; right:-90px;}
  #view-ideas .deco.i2{width:0;height:0; background:transparent !important; border-left:60px solid transparent; border-right:60px solid transparent; border-bottom:104px solid var(--on-color, var(--fg)); opacity:0.14; bottom:8%; left:-30px; transform:rotate(-12deg);}
  #view-ideas .deco.i3{width:160px; height:160px; bottom:-50px; right:16%; transform:rotate(30deg);}

  .idea-list{display:flex; flex-direction:column; gap:18px; margin-top:30px; position:relative; z-index:2;}
  .idea-card{
    background:var(--white); border:4px solid var(--fg); box-shadow:6px 6px 0px 0px var(--fg);
    padding:24px 26px; display:flex; align-items:center; gap:22px; transition:transform .2s ease-out;
  }
  .idea-card:hover{transform:translateY(-3px);}
  .idea-card.featured{color:var(--white); box-shadow:8px 8px 0px 0px var(--fg); padding:32px;}
  .idea-card.featured .idea-body p{color:rgba(255,255,255,0.92);}
  .idea-card.muted{opacity:0.85;}
  .idea-visual{flex-shrink:0; width:60px; height:60px; border:3px solid var(--fg); background:var(--white); display:flex; align-items:center; justify-content:center;}
  .idea-card.featured .idea-visual{background:var(--fg); border-color:var(--white); width:76px; height:76px;}
  .idea-visual .shape{width:26px;height:26px;}
  .idea-body{flex:1; min-width:0;}
  .idea-body h4{font-size:1.18rem; font-weight:900; text-transform:uppercase; margin:0 0 8px;}
  .idea-card.featured .idea-body h4{font-size:1.5rem;}
  .idea-body p{font-size:.95rem; line-height:1.55; margin:0 0 14px; max-width:520px; font-weight:500;}
  .idea-meta{display:flex; gap:8px; flex-wrap:wrap;}
  .pill{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; padding:5px 14px; border-radius:9999px; border:2px solid var(--fg);}
  .pill.easy{background:var(--blue); color:var(--white);}
  .pill.medium{background:var(--yellow); color:var(--fg);}
  .pill.hard{background:var(--red); color:var(--white);}
  .pill.time{background:var(--white); color:var(--fg);}
  .idea-card.featured .pill.time{background:rgba(255,255,255,0.18); color:var(--white); border-color:var(--white);}

  @media (max-width:640px){ .idea-card{flex-wrap:wrap;} }

  /* ---------- saved tray ---------- */
  #saved-tray{
    position:fixed; bottom:24px; right:24px; z-index:200;
    background:var(--white); border:3px solid var(--fg); box-shadow:5px 5px 0px 0px var(--fg);
    padding:12px 20px; display:flex; align-items:center; gap:10px;
    font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    opacity:0; transform:translateY(20px) rotate(-2deg);
    transition:opacity .25s ease-out, transform .25s ease-out;
    pointer-events:none;
  }
  #saved-tray.show{opacity:1; transform:translateY(0) rotate(-2deg); pointer-events:auto;}
  #saved-tray .dot{width:10px;height:10px;background:var(--yellow); border:2px solid var(--fg);}

  ::selection{background:var(--yellow); color:var(--fg);}
</style>
</head>
<body>

<header class="topbar">
  <button class="logo" data-nav="hero">
    <span class="logo-mark"><span class="c1"></span><span class="c2"></span><span class="c3"></span></span>
    <span class="logo-word">Buildr</span>
  </button>
  <nav class="topbar-actions">
    <button class="btn btn-outline small" data-nav="categories">Ideas</button>
  </nav>
</header>

<main>

  <section id="view-hero" class="view active">
    <div class="hero-grid">
      <div class="hero-overlap-2 deco square"></div>
      <div class="hero-overlap-3 deco circle"></div>
      <div class="hero-left">
        <h1 class="hero-title">Bored?<br>Build<br><span class="tilt">something.</span></h1>
        <p class="hero-sub">Skip the scroll. Get a project idea worth your evening — sorted by how good it feels to build, not just what's on the syllabus.</p>
        <div class="hero-actions">
          <button class="btn btn-red" data-nav="categories">Show me ideas</button>
          <button class="btn btn-outline" id="btn-surprise">Surprise me</button>
        </div>
      </div>
      <div class="hero-right">
        <div class="s1"></div>
        <div class="s2"></div>
        <div class="s5"></div>
        <div class="s4"></div>
        <div class="s3"></div>
      </div>
      <div class="hero-overlap-1 deco circle"></div>
    </div>
  </section>

  <section id="view-categories" class="view">
    <div class="deco d1 square"></div>
    <div class="deco d2 circle"></div>
    <div class="deco d3 tri"></div>
    <div class="back-row"><button class="btn-ghost" data-back="hero">← Back</button></div>
    <div class="section-header">
      <h2>Pick a <span class="tilt">lane.</span></h2>
      <p>Every category is sorted the same way — the ideas most worth your time come first.</p>
    </div>
    <div class="category-grid" id="category-grid"></div>
  </section>

  <section id="view-ideas" class="view">
    <div class="deco i1 circle"></div>
    <div class="deco i2 tri"></div>
    <div class="deco i3 square"></div>
    <div class="back-row"><button class="btn-ghost" data-back="categories">← Categories</button></div>
    <div class="section-header">
      <h2 id="ideas-title"></h2>
      <p id="ideas-sub"></p>
    </div>
    <div class="idea-list" id="idea-list"></div>
  </section>

</main>

<div id="saved-tray"><span class="dot"></span><span id="saved-count">0</span> saved</div>

      {t:"Meeting notes that write the recap", h:"Auto-generates a clean summary and action items straight from a call transcript.", d:"medium", time:"1 weekend"},
      {t:"One-pager generator", h:"Takes a messy doc and turns it into a polished, brand-consistent one-pager.", d:"easy", time:"1 weekend"},
      {t:"The 'so what' slide", h:"Feed it any chart and it drafts the one-sentence takeaway you'd otherwise stare at for ten minutes.", d:"easy", time:"1 evening"},
      {t:"The slide that answers questions", h:"An embeddable deck where viewers can ask the underlying data questions live, mid-meeting.", d:"hard", time:"1-2 weeks"}
    ]
  }
];

function shapeSVG(kind, color, size){
  size = size||18;
  if(kind==='circle') return `<div style="width:${size}px;height:${size}px;border-radius:9999px;background:var(--${color});"></div>`;
  if(kind==='square') return `<div style="width:${size}px;height:${size}px;border-radius:0;background:var(--${color});transform:rotate(${color==='yellow'?45:0}deg);"></div>`;
  return `<div style="width:0;height:0;border-left:${size/1.6}px solid transparent;border-right:${size/1.6}px solid transparent;border-bottom:${size*1.4}px solid var(--${color});"></div>`;
}

/* ---------------- navigation ---------------- */
function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+id).classList.add('active');
  window.scrollTo({top:0, behavior:'auto'});
}
document.querySelectorAll('[data-nav]').forEach(el=>{
  el.addEventListener('click', ()=>showView(el.dataset.nav));
});
document.querySelectorAll('[data-back]').forEach(el=>{
  el.addEventListener('click', ()=>showView(el.dataset.back));
});

/* ---------------- render categories ---------------- */
const grid = document.getElementById('category-grid');
DATA.forEach((cat, i)=>{
  const color = COLORS[i%3];
  const sizeClass = i===0 ? 'big' : (i===DATA.length-1 ? 'small' : '');
  const filled = i===0 || i===4;
  const card = document.createElement('div');
  card.className = `cat-card ${sizeClass} ${filled?'filled':''}`;
  if(filled) card.style.background = `var(--${color})`;
  card.innerHTML = `
    <div class="corner">${shapeSVG(['square','triangle','circle'][i%3], COLORS[(i+1)%3], 18)}</div>
    <div class="icon-box" style="${filled?'':'border-color:var(--fg);'}">
      <svg viewBox="0 0 24 24" fill="none" stroke="${filled?'var(--white)':'var(--fg)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${cat.icon}</svg>
    </div>
    <div>
      <h3>${cat.title}</h3>
      <div class="count">${cat.blurb}</div>
    </div>
  `;
  card.addEventListener('click', ()=>openCategory(cat.slug));
  grid.appendChild(card);
});

/* ---------------- render ideas ---------------- */
const ideaList = document.getElementById('idea-list');
const ideasView = document.getElementById('view-ideas');
let savedCount = 0;
const savedTray = document.getElementById('saved-tray');
const savedCountEl = document.getElementById('saved-count');

function diffLabel(d){ return d==='easy' ? 'Easy' : d==='medium' ? 'Medium' : 'Hard'; }

function openCategory(slug){
  const idx = DATA.findIndex(c=>c.slug===slug);
  const cat = DATA[idx];
  const color = COLORS[idx%3];
  ideasView.style.setProperty('--section-bg', `var(--${color})`);
  ideasView.style.setProperty('--on-color', ON_COLOR[color]);
  document.getElementById('ideas-title').textContent = cat.title;
  document.getElementById('ideas-sub').textContent = cat.blurb + ' Sorted with the best pick first.';
  ideaList.innerHTML = '';
  cat.ideas.forEach((idea, i)=>{
    const featured = i===0;
    const muted = i===cat.ideas.length-1 && cat.ideas.length>3;
    const shapeKind = ['circle','square','triangle'][i%3];
    const card = document.createElement('div');
    card.className = `idea-card ${featured?'featured':''} ${muted?'muted':''}`;
    if(featured) card.style.background = `var(--${color})`;
    card.innerHTML = `
      <div class="idea-visual">${shapeSVG(shapeKind, featured?'yellow':color, 24)}</div>
      <div class="idea-body">
        <h4>${idea.t}</h4>
        <p>${idea.h}</p>
        <div class="idea-meta">
          <span class="pill ${idea.d}">${diffLabel(idea.d)}</span>
          <span class="pill time">${idea.time}</span>
        </div>
      </div>
      <div class="idea-actions">
        <button class="icon-btn save-btn" title="Save">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h12v17l-6-4-6 4V4Z"/></svg>
        </button>
      </div>
    `;
    const saveBtn = card.querySelector('.save-btn');
    saveBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      saveBtn.classList.toggle('saved');
      savedCount += saveBtn.classList.contains('saved') ? 1 : -1;
      savedCountEl.textContent = savedCount;
      savedTray.classList.toggle('show', savedCount>0);
    });
    ideaList.appendChild(card);
  });
  showView('ideas');
}

/* ---------------- surprise me ---------------- */
document.getElementById('btn-surprise').addEventListener('click', ()=>{
  const cat = DATA[Math.floor(Math.random()*DATA.length)];
  openCategory(cat.slug);
});
</script>
